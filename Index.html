<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YKS İlk 1000 Hazırlık Paneli</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --accent: #38bdf8;
            --text: #f8fafc;
            --text-muted: #94a3b8;
            --success: #22c55e;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text);
            margin: 0;
            padding: 20px;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid var(--card-bg);
            padding-bottom: 20px;
            margin-bottom: 25px;
        }

        h1 { margin: 0; color: var(--accent); font-size: 24px; }
        .target-badge { background: #0369a1; padding: 6px 12px; border-radius: 20px; font-weight: bold; font-size: 14px; }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 20px;
            margin-bottom: 25px;
        }

        .card {
            background: var(--card-bg);
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }

        .card h2 { margin-top: 0; font-size: 18px; border-bottom: 1px solid #334155; padding-bottom: 10px; }

        .todo-item {
            display: flex;
            align-items: center;
            margin-bottom: 12px;
            cursor: pointer;
        }

        .todo-item input { margin-right: 12px; transform: scale(1.2); }

        .progress-bar {
            background: #334155;
            height: 12px;
            border-radius: 6px;
            overflow: hidden;
            margin-top: 10px;
        }

        .progress-fill {
            background: var(--accent);
            height: 100%;
            width: 0%;
            transition: width 0.3s ease;
        }

        textarea {
            width: 100%;
            height: 80px;
            background: #0f172a;
            border: 1px solid #334155;
            color: var(--text);
            border-radius: 6px;
            padding: 10px;
            box-sizing: border-box;
            resize: vertical;
        }

        button {
            background: var(--accent);
            color: #000;
            border: none;
            padding: 10px 15px;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
            margin-top: 10px;
        }

        button:hover { opacity: 0.9; }

        ul { list-style-type: none; padding: 0; }
        li { background: #0f172a; padding: 10px; margin-bottom: 8px; border-radius: 6px; border-left: 3px solid var(--accent); }
    </style>
</head>
<body>

<div class="container">
    <header>
        <div>
            <h1>Hedef: YKS İlk 1000</h1>
            <small style="color: var(--text-muted)">47k'den Zirveye İlerleme Paneli</small>
        </div>
        <div class="target-badge">Sistem Aktif</div>
    </header>

    <div class="grid">
        <!-- Günlük Rutinler -->
        <div class="card">
            <h2>Günlük Sabit Rutinler</h2>
            <div class="todo-item"><input type="checkbox" onchange="updateProgress()"> 30 Paragraf Sorusu</div>
            <div class="todo-item"><input type="checkbox" onchange="updateProgress()"> 30 Problem Sorusu</div>
            <div class="todo-item"><input type="checkbox" onchange="updateProgress()"> 30 Geometri Sorusu</div>
            <div class="todo-item"><input type="checkbox" onchange="updateProgress()"> 1 Adet TYT Branş Denemesi</div>
            
            <div style="margin-top:20px;">
                <small>Bugünkü İlerleme</small>
                <div class="progress-bar"><div class="progress-fill" id="progress"></div></div>
            </div>
        </div>

        <!-- Yapılamayan Sorular Defteri -->
        <div class="card">
            <h2>Haftalık Soru Defteri</h2>
            <textarea id="noteInput" placeholder="Yapamadığın zor soru kalıplarını ve kaynak adını buraya yaz..."></textarea>
            <button onclick="addNote()">Soru Ekle</button>
        </div>
    </div>

    <!-- Kaydedilen Notlar -->
    <div class="card">
        <h2>Tekrar Edilecek Zor Sorular & Notlar</h2>
        <ul id="noteList"></ul>
    </div>
</div>

<script>
    function updateProgress() {
        const checkboxes = document.querySelectorAll('.todo-item input[type="checkbox"]');
        let checked = 0;
        checkboxes.forEach(cb => { if(cb.checked) checked++; });
        const percent = (checked / checkboxes.length) * 100;
        document.getElementById('progress').style.width = percent + '%';
    }

    function addNote() {
        const input = document.getElementById('noteInput');
        if(!input.value.trim()) return;
        
        const li = document.createElement('li');
        li.textContent = input.value;
        document.getElementById('noteList').appendChild(li);
        input.value = '';
    }
</script>

</body>
</html>
